# Track2 Runtime 0.3.5 发布默认配置。
# 正式入口逐次渲染 case、seed、GPU 和私有控制端口。
case_id: 001_real_world_images__real_image_1
seed: 0
casebank: judge_private/casebank
max_steps: 400
max_sim_time_s: 20.0
max_concurrency: 1
action_timeout_s: 5.0
stop_confirm_timeout_s: 5.0
camera_required: true
render_gpu: "0"
text_instruction: "Move the target object to the position shown in the reference image."
lease_renew_interval_s: 5.0
# 0 表示关闭。正式入口分配本次运行端口；不将历史端口打入发布包。
judge_control_port: 0
# 正式选手评测不启用裁判规划输入。
oracle_planning: false
