# track2-maniskill-runtime 的配置。
#
# **case_id 与 seed 走环境变量**（`TRACK2_CASE_ID` / `TRACK2_SEED`），
# 因为它们是**每个 case 的评测输入**，不该固化进 Bundle —— 否则换个 case
# 就得重新打包。这里留的值只是**调试默认值**。
#
# 评测机注入方式（任选其一）：
#   * `skill.yaml` 的 `profiles.<p>.environment`
#   * 启动前 `export TRACK2_CASE_ID=xxx TRACK2_SEED=0`

case_id: 001_real_world_images__real_image_1
seed: 0

# 相对路径按 `TRACK2_PHYSICS_ROOT` 解析（不是按本文件所在目录）——
# 因为 PAOS 的 installer 会把 profile 文件软链到另一个位置，
# 从那里往上推是错的。绝对路径照常。
casebank: judge_private/casebank      # 相对 TRACK2_PHYSICS_ROOT

# episode 预算 —— 与评测器 runner 的语义一致
max_steps: 2400
max_sim_time_s: 120.0

# Action 治理（Q9 / Q12 / Q14）
max_concurrency: 1              # Q9：关节控制天然串行
action_timeout_s: 30.0          # Q14 待 73 case 实测，当前是保守占位值
stop_confirm_timeout_s: 5.0     # Q13：「等 backend 确认真实停止」的上限

# 观测（第 5 步 / 模式 B）
# 相机默认**必需**：原始图文是选手唯一的感知来源，没相机这条链路不成立。
# 诊断场景（只想量物理）可以设 false —— 那时不建相机、跑得更快。
camera_required: true

# 给选手的自然语言指令（公开输入之一，不含任何答案）
text_instruction: "Move the target object to the position shown in the reference image."

# provider 注册续租间隔（必须小于 gateway.yaml 的 lease_ttl_ms=15000）
lease_renew_interval_s: 5.0

# Judge-only 私有控制口（B1）。**0 = 关闭**（CPU 回归不开监听）。
#
# >0 时 runtime 节点在 loopback 上开一个只给裁判用的 HTTP 口：
#   POST /episode/reset     换 episode（case/seed/mode）
#   GET  /episode/snapshot  judge-only 真值（选手够不到 —— 沙箱无网络）
#
# ⚠️ 走**配置**而不是环境变量：`dora start --detach` 下节点由长命的
#    dora daemon spawn，daemon 环境里没有评测时设的变量 —— 用环境变量
#    会静默地不开控制口。裁判侧逐次渲染本文件，端口一定到得了。
judge_control_port: 0
